# Supabase project configuration for local development (`supabase start`) and as the
# reference for hosted project settings. Secrets are read from the environment, never
# committed. See docs/BACKEND.md.
project_id = "paceleague"

[api]
enabled = true
port = 54321
# Only `public` is exposed through the API; `private` holds tables and helpers that clients
# can never reach directly.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
shadow_port = 54320
major_version = 16

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "paceleague://"
additional_redirect_urls = ["paceleague://auth-callback", "http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.rate_limit]
# Per hour. Keep low: the only email the product sends is the sign-in code.
email_sent = 4
token_verifications = 30
sign_in_sign_ups = 30
token_refresh = 150

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your PaceLeague sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.email.template.confirmation]
subject = "Your PaceLeague sign-in code"
content_path = "./supabase/templates/sign-in-code.html"

[auth.sms]
enable_signup = false

[auth.external.apple]
# Native Sign in with Apple (ID token flow). client_id lists the iOS bundle identifier(s);
# secret is only needed for the web OAuth flow, which V1 does not use.
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
skip_nonce_check = false

[edge_runtime]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false
